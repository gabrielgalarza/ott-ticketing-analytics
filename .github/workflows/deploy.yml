name: Build & deploy dashboard

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the keep-alive commit below needs write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync data from SweatPals API
        env:
          SWEATPALS_API_KEY: ${{ secrets.SWEATPALS_API_KEY }}
          SWEATPALS_HOST: https://ilove.sweatpals.com
        run: python -m src.sync

      - name: Refresh marketing snapshots from Windsor.ai
        # Soft-fails if WINDSOR_API_KEY is unset or the API errors — keeps committed snapshots
        # so the dashboard still deploys with last-known data instead of breaking.
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python scripts/refresh_marketing_data.py

      - name: Commit refreshed snapshots (keeps the cron alive)
        # GitHub disables `schedule:` triggers after 60 days with no repo activity. That silently
        # froze this dashboard for ~2.5 weeks in Nov 2026 — the page still served 200, just with
        # month-old numbers. Committing the snapshots this run already regenerated counts as
        # activity, so the schedule never expires. Pushes made with GITHUB_TOKEN do not trigger
        # workflows, so this cannot loop. Non-fatal: a failure here must not block the deploy.
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          msg="Refresh marketing + social snapshots [skip ci]"
          if git diff --cached --quiet; then
            # Nothing changed upstream. Only force a commit if the repo is drifting toward the
            # 60-day cutoff, so we get at most one heartbeat a month instead of 4 commits a day.
            age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
            echo "No snapshot changes; last commit was ${age_days}d ago."
            if [ "$age_days" -lt 30 ]; then
              echo "Under 30d — nothing to do."
              exit 0
            fi
            date -u +"%Y-%m-%dT%H:%M:%SZ" > data/.heartbeat
            git add data/.heartbeat
            msg="Keep-alive heartbeat so the deploy schedule does not expire [skip ci]"
          fi
          git commit -m "$msg"
          git push

      - name: Build static dashboard
        run: python -m src.build_static

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
